[project]
name = "datasetpreparator"
version = "2.0.0"
description = "Tools for dataset processing."
authors = [{ name = "Andrzej 'Kaszanas' Białecki" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["click>=8.1.7,<9"]

[project.optional-dependencies]
all = ["sc2reader>=1.8.0,<2", "tqdm>=4.66.1,<5", "requests>=2.31.0,<3"]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10",
    "pytest-cov>=7.0.0,<8",
    "ruff>=0.15.22",
    "pre-commit>=4.0.1,<5",
    "mkdocs>=1.5.3,<2",
    "mkdocstrings>=1.0.0,<2",
    "mkdocstrings-python>=2.0.1,<3",
    "mkdocs-material>=9.5.3,<10",
    "mkdocs-include-markdown-plugin>=7.0.1,<8",
    "mkdocs-material-extensions>=1.3.1,<2",
    "mkdocs-autorefs>=1.2.0,<2",
    "mkdocs-gen-files>=0.6.0,<0.7",
    "mkdocs-literate-nav>=0.6.1,<0.7",
    "mkdocs-section-index>=0.3.8,<0.4",
    "commitizen>=4.1.0,<5",
    "python-dotenv>=1.0.1,<2",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "2.1.0"
tag_format = "$version"

[tool.pytest.ini_options]
python_files = "*_test.py"
log_cli = true
log_cli_level = "DEBUG"
markers = [
    "minor: marks tests as minor (deselect with '-m \"not minor\"')",
    "major",
    "run_this: marks single tests to be run with proper imports",
    "fast: marks a test with fast execution.",
    "slow: marks a test with slow execution.",
]

[tool.hatch.build.targets.wheel]
packages = ["src/datasetpreparator"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
